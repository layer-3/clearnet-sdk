name: Push on master or RC tag

on:
  push:
    # RC branch changes are checked by main-pr.yml through their pull request.
    branches: [master]
    tags: ['v0.9.0-rc*']

permissions:
  contents: read

jobs:
  unit:
    name: Unit
    uses: ./.github/workflows/test-go.yml

  forge:
    name: Forge
    uses: ./.github/workflows/test-forge.yml

  typescript:
    name: TypeScript
    uses: ./.github/workflows/test-ts.yml

  integration:
    name: Integration
    uses: ./.github/workflows/test-integration.yml

  artifacts:
    name: Artifacts
    uses: ./.github/workflows/check-release-artifacts.yml

  cli:
    name: Yellow CLI
    uses: ./.github/workflows/yellow.yml
