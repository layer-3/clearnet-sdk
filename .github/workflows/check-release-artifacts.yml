name: Release artifact checks

# Validate the SDK's shipped files without access to consumer repositories.
on:
  workflow_call:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check artifact validation regressions
        run: python3 scripts/test-check-release-artifacts.py
      - name: Check shipped artifacts and provenance
        run: python3 scripts/check-release-artifacts.py .
