name: Test (Forge)

# This is the SDK's generated-code drift gate: it covers both the pre-existing
# .abi -> *_abi.go step and the .sol -> .abi one.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  forge:
    name: Forge
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v6

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned (not "stable") as the bindings staleness gate below
          # relies on forge's build output being byte-reproducible.
          version: v1.7.1

      - name: Install contract dependencies
        run: |
          [ -d lib/forge-std ] || forge install --no-git foundry-rs/forge-std@v1.16.1
          [ -d lib/openzeppelin-contracts ] || forge install --no-git openzeppelin/openzeppelin-contracts@v5.5.0

      - name: Forge fmt
        run: forge fmt --check

      - name: Forge build
        run: forge build --sizes

      - name: Forge test
        run: forge test -vvv

      - name: Re-extract the vendored ABIs
        run: |
          jq '.abi' out/IClearnetRegistry.sol/IClearnetRegistry.json \
            > ../pkg/blockchain/evm/artifacts/ClearnetRegistry.abi
          jq '.abi' out/IClearnetRegistryProtocol.sol/IClearnetRegistryProtocol.json \
            > ../pkg/blockchain/evm/artifacts/ClearnetRegistryProtocol.abi
          jq -r '.abi' out/ConfigRegistry.sol/ConfigRegistry.json \
            > ../pkg/blockchain/evm/artifacts/ConfigRegistry.abi
          jq -r '.bytecode.object' out/ConfigRegistry.sol/ConfigRegistry.json \
            > ../pkg/blockchain/evm/artifacts/ConfigRegistry.bin
          jq -r '.abi' out/IConfig.sol/IConfig.json \
            > ../pkg/blockchain/evm/artifacts/IConfig.abi
          jq -r '.abi' out/Config.sol/Config.json \
            > ../pkg/blockchain/evm/artifacts/Config.abi
          jq -r '.bytecode.object' out/Config.sol/Config.json \
            > ../pkg/blockchain/evm/artifacts/Config.bin

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Bindings are up to date
        run: |
          go generate ./pkg/blockchain/evm/...
          if ! git diff --exit-code -- pkg/blockchain/evm/; then
            echo "::error::pkg/blockchain/evm/ is stale. Run \`make generate\` and commit the result."
            exit 1
          fi
        working-directory: .
