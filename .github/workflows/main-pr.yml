name: PR on master

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: sdk-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit
    uses: ./.github/workflows/test-go.yml

  forge:
    name: Forge
    uses: ./.github/workflows/test-forge.yml

  typescript:
    name: TypeScript
    uses: ./.github/workflows/test-ts.yml

  integration:
    name: Integration
    uses: ./.github/workflows/test-integration.yml

  artifacts:
    name: Artifacts
    uses: ./.github/workflows/check-release-artifacts.yml

  cli:
    name: Yellow CLI
    uses: ./.github/workflows/yellow.yml
